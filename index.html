<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogicLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>LogicLab</h1>
  <p>Πάτησε πάνω στις εισόδους για να αλλάξεις την τιμή τους.</p>

<div id="circuit">
  <div class="inputs">
    <button class="bit" data-name="A">A = 0</button>
    <button class="bit" data-name="B">B = 0</button>
    <button class="bit" data-name="C">C = 0</button>
  </div>

  <label>Πύλη 1 (A, B): <select id="gate1"></select></label>
  <label>Πύλη 2 (Πύλη 1    <svg id="diagram" viewBox="0 0 420 180" role="img" aria-label="Διάγραμμα κυκλώματος">
    <text x="10" y="50">A</text>
    <text x="10" y="80">B</text>
    <text x="10" y="145">C</text>

    <line id="wireA" x1="30" y1="45" x2="160" y2="45" />
    <line id="wireB" x1="30" y1="75" x2="160" y2="75" />
    <line id="wireC" x1="30" y1="140" x2="290" y2="140" />
    <polyline id="wireG1" points="210,60 250,60 250,110 290,110" />
    <line id="wireY" x1="340" y1="125" x2="390" y2="125" />

    <path id="gate1Extra" class="gate-extra" />
    <path id="gate1Shape" class="gate" />
    <text id="gate1Label" class="gate-name" x="180" y="107">AND</text>
    <circle id="bubble1" class="bubble" cx="214" cy="60" r="4" />

    <path id="gate2Extra" class="gate-extra" />
    <path id="gate2Shape" class="gate" />
    <text id="gate2Label" class="gate-name" x="310" y="172">OR</text>
    <circle id="bubble2" class="bubble" cx="344" cy="125" r="4" />

    <text x="396" y="130">Y</text>
  </svg> C): <select id="gate2"></select></label>

  <p>Έξοδος πύλης 1: <span id="g1">0</span></p>
  <p>Έξοδος Y: <span id="y" class="out">0</span></p>
</div>
  <div id="truth-table"></div>

  <script src="code/logic.js"></script>
  <script src="code/app.js"></script>
</body>
</html>
